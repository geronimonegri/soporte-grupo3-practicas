<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Texto a Voz - gTTS</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm mt-5">
                    <div class="card-body p-4">
                        <h1 class="card-title text-center mb-4 h3">Convertir texto a voz</h1>

                        <form method="POST">
                            <div class="mb-3">
                                <label for="idioma" class="form-label">Idioma</label>
                                <select name="idioma" id="idioma" class="form-select">
                                    {% for codigo, nombre in idiomas.items() %}
                                        <option value="{{ codigo }}" {% if codigo == idioma_seleccionado %}selected{% endif %}>
                                            {{ nombre }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="texto" class="form-label">Texto</label>
                                <textarea
                                    name="texto"
                                    id="texto"
                                    class="form-control"
                                    rows="5"
                                    placeholder="Escribí el texto que querés escuchar..."
                                >{{ texto }}</textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Generar audio</button>
                            </div>
                        </form>

                        {% if audio_file %}
                            <div class="mt-4">
                                <audio controls autoplay class="w-100">
                                    <source src="{{ url_for('audio', nombre_archivo=audio_file) }}" type="audio/mpeg">
                                    Tu navegador no soporta el elemento de audio.
                                </audio>
                            </div>
                        {% endif %}
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
