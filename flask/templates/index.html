<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Películas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">Listado de películas</h1>

      <a href="/nueva" class="btn btn-success mb-3"> Agregar Película </a>

      <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          {% for pelicula in peliculas %}
          <tr>
            <td>{{ pelicula[0] }}</td>
            <td>{{ pelicula[1] }}</td>
            <td>{{ pelicula[2] }}</td>

            <td>
              <a
                href="/editar/{{ pelicula[0] }}"
                class="btn btn-warning btn-sm"
              >
                Editar
              </a>

              <a
                href="/eliminar/{{ pelicula[0] }}"
                class="btn btn-danger btn-sm"
              >
                Eliminar
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
